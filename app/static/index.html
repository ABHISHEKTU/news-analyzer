<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial News Analyzer — Sentiment Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #151B24;
    --ink-soft: #1E2733;
    --paper: #F5EFE1;
    --paper-dim: #E8E0CC;
    --rule: #3A4553;
    --text-on-ink: #EDE6D4;
    --text-dim: #8D97A5;
    --pos: #3D7A63;
    --neg: #B8543A;
    --neu: #B08C3E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text-on-ink);
    font-family: 'Source Serif 4', Georgia, serif;
    line-height: 1.5;
  }

  .mono {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }

  /* Masthead */
  header.masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--text-on-ink);
    padding-bottom: 1rem;
    margin-bottom: 2.5rem;
  }

  header.masthead h1 {
    font-size: 1.65rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  header.masthead .date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  /* Hero gauge */
  .gauge-section {
    background: var(--paper);
    color: var(--ink);
    border-radius: 3px;
    padding: 2rem 2rem 1.75rem;
    margin-bottom: 2rem;
  }

  .gauge-label {
    font-size: 0.85rem;
    color: #6B6255;
    margin: 0 0 0.35rem;
  }

  .gauge-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 3.2rem;
    font-weight: 600;
    line-height: 1;
    margin: 0 0 1.25rem;
  }

  .gauge-value.pos { color: var(--pos); }
  .gauge-value.neg { color: var(--neg); }
  .gauge-value.neu { color: var(--neu); }

  .gauge-bar {
    position: relative;
    height: 8px;
    background: linear-gradient(to right, var(--neg), var(--paper-dim) 50%, var(--pos));
    border-radius: 4px;
    margin: 0.5rem 0 0.75rem;
  }

  .gauge-marker {
    position: absolute;
    top: -6px;
    width: 3px;
    height: 20px;
    background: var(--ink);
    transform: translateX(-50%);
  }

  .gauge-scale {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: #8A8171;
  }

  /* Two-column breakdown */
  .breakdown {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--rule);
    margin-bottom: 2.5rem;
    border-radius: 3px;
    overflow: hidden;
  }

  .breakdown-col {
    background: var(--ink-soft);
    padding: 1.5rem 1.75rem;
  }

  .breakdown-col .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    margin: 0 0 0.5rem;
  }

  .breakdown-col .score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.9rem;
    font-weight: 500;
    margin: 0 0 0.25rem;
  }

  .breakdown-col .count {
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  /* Ledger table */
  .ledger h2 {
    font-size: 1rem;
    font-weight: 600;
    text-transform: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.6rem;
    margin-bottom: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  thead th {
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    font-weight: 500;
    color: var(--text-dim);
    padding: 0.6rem 0.5rem;
    border-bottom: 1px solid var(--rule);
  }

  tbody td {
    padding: 0.7rem 0.5rem;
    border-bottom: 1px solid var(--ink-soft);
    vertical-align: top;
  }

  tbody tr:hover {
    background: rgba(255,255,255,0.02);
  }

  .headline {
    max-width: 420px;
  }

  .headline a {
    color: var(--text-on-ink);
    text-decoration: none;
  }

  .headline a:hover {
    text-decoration: underline;
  }

  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    padding: 0.15rem 0.45rem;
    border-radius: 2px;
    display: inline-block;
  }

  .tag.rss { background: rgba(80,120,180,0.18); color: #8FB4E8; }
  .tag.stocktwits { background: rgba(180,140,80,0.18); color: #D4AA6E; }

  .sentiment-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    font-weight: 500;
  }

  .sentiment-label.positive { color: var(--pos); }
  .sentiment-label.negative { color: var(--neg); }
  .sentiment-label.neutral { color: var(--neu); }

  .score-cell {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  /* Status / empty / loading */
  .status-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-dim);
    padding: 2rem 0;
    text-align: center;
  }

  .status-line.error {
    color: var(--neg);
  }

  /* Trigger button */
  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
  }

  button.trigger {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    background: transparent;
    color: var(--text-on-ink);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 0.5rem 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  button.trigger:hover {
    border-color: var(--text-on-ink);
  }

  button.trigger:disabled {
    opacity: 0.5;
    cursor: default;
  }

  @media (max-width: 640px) {
    .breakdown { grid-template-columns: 1fr; }
    .headline { max-width: 220px; }
    thead th:nth-child(2), tbody td:nth-child(2) { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>Sentiment Desk</h1>
    <span class="date mono" id="asof">—</span>
  </header>

  <section class="gauge-section" id="gauge-section">
    <p class="gauge-label">Combined Market Mood</p>
    <p class="gauge-value mono" id="mood-value">—</p>
    <div class="gauge-bar">
      <div class="gauge-marker" id="gauge-marker" style="left: 50%;"></div>
    </div>
    <div class="gauge-scale">
      <span>−1.0 bearish</span>
      <span>0</span>
      <span>+1.0 bullish</span>
    </div>
  </section>

  <section class="breakdown">
    <div class="breakdown-col">
      <p class="kicker">NEWS SENTIMENT · FINBERT</p>
      <p class="score mono" id="news-score">—</p>
      <p class="count" id="news-count">— articles</p>
    </div>
    <div class="breakdown-col">
      <p class="kicker">SOCIAL SENTIMENT · VADER</p>
      <p class="score mono" id="social-score">—</p>
      <p class="count" id="social-count">— posts</p>
    </div>
  </section>

  <section class="ledger">
    <div class="actions">
      <h2>Recent Activity</h2>
      <button class="trigger" id="trigger-btn">RUN SCAN</button>
    </div>
    <div id="table-container">
      <p class="status-line">Loading…</p>
    </div>
  </section>

</div>

<script>
  const API_BASE = '/api';

  function fmtScore(n) {
    if (n === null || n === undefined) return '—';
    const sign = n > 0 ? '+' : '';
    return sign + n.toFixed(4);
  }

  function moodClass(n) {
    if (n > 0.05) return 'pos';
    if (n < -0.05) return 'neg';
    return 'neu';
  }

  async function loadReport() {
    try {
      const res = await fetch(`${API_BASE}/report`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      const mood = data.combined_market_mood ?? 0;
      const cls = moodClass(mood);

      const moodEl = document.getElementById('mood-value');
      moodEl.textContent = fmtScore(mood);
      moodEl.className = `gauge-value mono ${cls}`;

      const pct = ((mood + 1) / 2) * 100;
      document.getElementById('gauge-marker').style.left = `${Math.min(100, Math.max(0, pct))}%`;

      document.getElementById('news-score').textContent = fmtScore(data.news_sentiment);
      document.getElementById('news-count').textContent = `${data.news_count ?? 0} articles`;
      document.getElementById('social-score').textContent = fmtScore(data.social_sentiment);
      document.getElementById('social-count').textContent = `${data.social_count ?? 0} posts`;

      document.getElementById('asof').textContent = new Date().toLocaleString('en-US', {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    } catch (err) {
      document.getElementById('mood-value').textContent = 'ERR';
      console.error('Report fetch failed:', err);
    }
  }

  async function loadArticles() {
    const container = document.getElementById('table-container');
    try {
      const res = await fetch(`${API_BASE}/articles?limit=30`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const articles = await res.json();

      if (!articles.length) {
        container.innerHTML = '<p class="status-line">No articles yet. Run a scan to populate the desk.</p>';
        return;
      }

      const rows = articles.map(a => {
        const label = (a.sentiment_label || '').toLowerCase();
        const sourceTag = a.source_type === 'rss' ? 'rss' : 'stocktwits';
        const sourceLabel = a.source_type === 'rss' ? 'NEWS' : 'SOCIAL';
        const scraped = a.scraped_at ? new Date(a.scraped_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';
        return `
          <tr>
            <td class="headline"><a href="${a.url}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a></td>
            <td><span class="tag ${sourceTag}">${sourceLabel}</span></td>
            <td><span class="sentiment-label ${label}">${(a.sentiment_label || '—').toUpperCase()}</span></td>
            <td class="score-cell">${a.sentiment_score !== null ? a.sentiment_score.toFixed(3) : '—'}</td>
            <td class="score-cell">${scraped}</td>
          </tr>`;
      }).join('');

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Headline</th>
              <th>Source</th>
              <th>Sentiment</th>
              <th>Score</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    } catch (err) {
      container.innerHTML = '<p class="status-line error">Could not load articles. Is the API running?</p>';
      console.error('Articles fetch failed:', err);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  async function refreshAll() {
    await Promise.all([loadReport(), loadArticles()]);
  }

  document.getElementById('trigger-btn').addEventListener('click', async () => {
    const btn = document.getElementById('trigger-btn');
    btn.disabled = true;
    btn.textContent = 'QUEUING…';
    try {
      const res = await fetch(`${API_BASE}/trigger-scan`, { method: 'POST' });
      const data = await res.json();
      btn.textContent = 'SCAN QUEUED';
      // Poll status a few times, then refresh
      let attempts = 0;
      const poll = setInterval(async () => {
        attempts++;
        const statusRes = await fetch(`${API_BASE}/task-status/${data.task_id}`);
        const statusData = await statusRes.json();
        if (statusData.status === 'SUCCESS' || statusData.status === 'FAILURE' || attempts > 20) {
          clearInterval(poll);
          btn.disabled = false;
          btn.textContent = 'RUN SCAN';
          refreshAll();
        }
      }, 3000);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'RUN SCAN';
      console.error('Trigger failed:', err);
    }
  });

  refreshAll();
</script>
</body>
</html>
